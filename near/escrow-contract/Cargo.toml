[package]
name = "air-otc-near-pool"
description = "Privacy-preserving pooled escrow contract for AIR OTC on NEAR"
version = "0.3.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
publish = false
repository = "https://github.com/gulbadanjhumur397-web/AIROTC"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
borsh = "1.5.7"
near-sdk = { version = "5.29.1", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["legacy", "unit-testing"] }
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

