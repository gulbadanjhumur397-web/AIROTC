name: Publish TEE worker image

on:
  workflow_dispatch:
  push:
    branches:
      - near-testnet-hackathon
    paths:
      - ".github/workflows/publish-tee-worker.yml"
      - "near/package.json"
      - "near/pnpm-lock.yaml"
      - "near/pnpm-workspace.yaml"
      - "near/.dockerignore"
      - "near/shared-types/**"
      - "near/tee-worker/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: tee-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: near/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: near
        run: pnpm install --frozen-lockfile

      - name: Verify worker
        working-directory: near
        run: |
          pnpm --filter @air-otc/shared-types build
          pnpm --filter @air-otc/tee-worker typecheck
          pnpm --filter @air-otc/tee-worker test
          pnpm --filter @air-otc/tee-worker build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable worker image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: near
          file: near/tee-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/airotc-tee-worker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/airotc-tee-worker:testnet
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record digest
        run: |
          echo "### AIROTC TEE worker" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/airotc-tee-worker@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
